<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Alice in Cradle (ver0.30) 技术文档库</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Alice in Cradle (ver0.30) 运行环境与虚拟机检测机制深度逆向分析、开源引导器与本地修补方案技术文档库">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    :root {
      --theme-color: #2c3e50;
    }
    html, body {
      min-width: 320px;
    }
    .markdown-section {
      max-width: 900px;
      padding: 20px 15px;
    }
    /* Mobile-first code & table scrolling */
    .markdown-section pre,
    .markdown-section pre > code {
      overflow-x: auto;
      white-space: pre;
      word-wrap: normal;
    }
    .markdown-section table {
      display: block;
      width: 100%;
      overflow-x: auto;
      border-spacing: 0;
      border-collapse: collapse;
    }
    /* Touch target sizing for mobile (>= 24px) */
    .sidebar-nav a {
      min-height: 28px;
      line-height: 28px;
      display: inline-block;
    }
    .app-nav a {
      min-height: 28px;
      line-height: 28px;
    }
    @media screen and (max-width: 600px) {
      .markdown-section {
        padding: 15px 10px;
      }
    }
  </style>
</head>
<body>
  <div id="app">正在载入技术文档...</div>
  <script>
    window.$docsify = {
      name: 'Alice in Cradle 逆向技术文档',
      repo: 'https://github.com/hazure/alice-in-cradle-030-vm-patch',
      loadSidebar: true,
      loadNavbar: true,
      subMaxLevel: 3,
      auto2top: true,
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: '搜索技术文档',
        noData: '未找到相关结果',
        depth: 4
      },
      copyCode: {
        buttonText: '复制',
        errorText: '错误',
        successText: '已复制'
      }
    }
  </script>
  <!-- Docsify v4 -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <!-- Search Plugin -->
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <!-- Copy Code Plugin -->
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <!-- Prism Highlighting -->
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-c.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-csharp.min.js"></script>
</body>
</html>
