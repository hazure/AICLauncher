tasks:
  - id: T01
    title: 清理仓库结构并建立检查点
    batch: 批次一（基线冻结）
    plan_ref: "PLAN.md 第八章（四）— 检查点与基线哈希清单 baseline.json"
    depends_on: []
    parallel_group: solo
    write_paths:
      - docs/baseline/baseline.json
      - .gitignore
    forbidden_paths:
      - src/stub_perfect.c
      - "*.keystore"
      - "rootfs*"
      - AliceInCradle.exe
      - UnityPlayer.dll
      - Assembly-CSharp.dll
      - "AliceInCradle_Data/**"
      - "download_urls*"
    goal: 清理仓库结构、建立可回滚检查点标签并生成基线哈希清单 docs/baseline/baseline.json
    acceptance:
      - id: AC-T01-1
        cmd: python3 -c "import json; d=json.load(open('docs/baseline/baseline.json')); assert len(d)>0"
        expect: exit==0
      - id: AC-T01-2
        cmd: git status --porcelain
        expect: exit==0
    rollback: git checkout -- .gitignore && rm -f docs/baseline/baseline.json
    risk: 基线未锁定导致后续零污染回归无参照；触发条件：基线清单缺失或包含临时产物
    owner: human
    status: done

  - id: T02
    title: 补齐说明文件与开发日志模板
    batch: 批次一（基线冻结）
    plan_ref: "PLAN.md 第十二章（一）— 协作说明文件 AGENTS.md 与进度台账 PROGRESS.md"
    depends_on:
      - T01
    parallel_group: solo
    write_paths:
      - AGENTS.md
      - docs/PROGRESS.md
      - README.md
    forbidden_paths:
      - src/stub_perfect.c
      - "*.keystore"
      - "rootfs*"
      - AliceInCradle.exe
      - UnityPlayer.dll
      - Assembly-CSharp.dll
      - "AliceInCradle_Data/**"
      - "download_urls*"
    goal: 补齐仓库根协作说明文件 AGENTS.md（含第十二章架构红线、提交纪律、流水线待办占位）、进度台账模板 docs/PROGRESS.md 与构建指引 README.md
    acceptance:
      - id: AC-T02-1
        cmd: test -f AGENTS.md && test -f docs/PROGRESS.md && test -f README.md
        expect: exit==0
      - id: AC-T02-2
        cmd: grep -q "T13" AGENTS.md
        expect: exit==0
    rollback: git checkout -- README.md && rm -f AGENTS.md docs/PROGRESS.md
    risk: 协作约束未固化导致后续智能体越界；触发条件：AGENTS.md 缺少禁止清单或待办占位
    owner: agent
    status: done

  - id: T03
    title: 放置注入三件套并校验目录
    batch: 批次二（注入打通）
    plan_ref: "PLAN.md 第二章（四）— 插件框架注入三件套与目录校验清单"
    depends_on:
      - T01
    parallel_group: solo
    write_paths:
      - docs/baseline/injection_trio_manifest.json
    forbidden_paths:
      - src/stub_perfect.c
      - "*.keystore"
      - "rootfs*"
      - AliceInCradle.exe
      - UnityPlayer.dll
      - Assembly-CSharp.dll
      - "AliceInCradle_Data/**"
      - "download_urls*"
    goal: 在游戏根目录放置插件框架注入三件套（网络劫持组件、引导配置文件、插件框架目录）并记录校验清单
    acceptance:
      - id: AC-T03-1
        cmd: python3 -c "import json; d=json.load(open('docs/baseline/injection_trio_manifest.json')); assert len(d.get('paths',[]))==3"
        expect: exit==0
    rollback: 移除游戏根目录注入三件套并删除 docs/baseline/injection_trio_manifest.json
    risk: 注入三件套路径或版本不匹配导致插件框架不加载；触发条件：动态库搜索顺序劫持未生效
    owner: human
    status: done

