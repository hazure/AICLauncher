      - Assembly-CSharp.dll
      - "AliceInCradle_Data/**"
      - "download_urls*"
    goal: 编写仅打印日志的最小示例插件，验证插件框架可随引导程序拉起并在引擎日志中输出插件行
    acceptance:
      - id: AC-T04-1
        cmd: test -f plugins/HelloPlugin/HelloPlugin.cs && test -f plugins/HelloPlugin/HelloPlugin.csproj
        expect: exit==0
      - id: AC-T04-2
