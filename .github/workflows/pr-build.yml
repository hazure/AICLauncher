name: PR Build Check

on:
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  pr-build-check:
    if: contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests and assembleDebug
        run: |
          INIT_SCRIPT="${RUNNER_TEMP:-/tmp}/maven-mirror.init.gradle"
          cat <<'EOF' > "$INIT_SCRIPT"
          beforeSettings { settings ->
              settings.pluginManagement {
                  repositories {
                      maven {
                          name = "GoogleMavenCentralMirror"
                          url = uri("https://maven-central.storage-download.googleapis.com/maven2/")
                      }
                  }
              }
              settings.dependencyResolutionManagement {
                  repositories {
                      maven {
                          name = "GoogleMavenCentralMirror"
                          url = uri("https://maven-central.storage-download.googleapis.com/maven2/")
                      }
                  }
              }
          }
          EOF
          chmod +x client/android/gradlew
          set -o pipefail
          cd client/android
          attempt=0
          max_retries=2
          while true; do
            if ./gradlew --init-script "$INIT_SCRIPT" testDebugUnitTest assembleDebug --stacktrace 2>&1 | tee ../../build_output.log; then
              break
            fi
            if [ "$attempt" -lt "$max_retries" ] && grep -qE "429|Too Many Requests|Connection reset|Read timed out|Connect timed out|UnknownHostException|Could not GET|Could not HEAD|SocketTimeoutException|502|503|504" ../../build_output.log; then
              attempt=$((attempt + 1))
              echo "Transient network/429 error detected. Retrying ($attempt/$max_retries) in 10s..."
              sleep 10
            else
              exit 1
            fi
          done

      - name: Upload Debug APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pr-debug-apk
          path: client/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Comment failure log on PR
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.BOT_PAT || secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let raw = '';
            if (fs.existsSync('build_output.log')) {
              raw = fs.readFileSync('build_output.log', 'utf8');
            }
            const lines = raw.split('\n');
            const interesting = [];
            for (let i = 0; i < lines.length; i++) {
              if (/FAILURE:|^(e:|> Task .* FAILED)|Exception:/i.test(lines[i])) {
                interesting.push(...lines.slice(Math.max(0, i - 2), Math.min(lines.length, i + 12)));
              }
            }
            let snippet = interesting.length > 0 ? interesting.join('\n') : lines.slice(-120).join('\n');
            if (snippet.length > 40000) {
              snippet = snippet.slice(-40000);
            }
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              '### ❌ Android 构建或单元测试失败',
              '',
              '请贡献者确认以下三项：',
              '1. 是否对代码进行过审查？',
              '2. 验证脚本是否全部 pass？',
              '3. 是否在本地跑过一遍？',
              '',
              `🔗 [查看完整 Actions 运行日志](${runUrl})`,
              '',
              '<details>',
              '<summary>编译/测试失败原文日志</summary>',
              '',
              '```text',
              snippet || '(empty log)',
              '```',
              '</details>'
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body
            });
