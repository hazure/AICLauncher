name: Android APK Build

on:
  push:
    branches: [ dev, nocheck_dev ]
  pull_request:
    branches: [ dev ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-provider: basic

      - name: Run Unit Tests, Lint, and Build Debug APK
        working-directory: client/android
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIC-Launcher-Debug
          path: client/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload UI Screenshot artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AIC-Launcher-Screenshots
          path: client/android/app/build/reports/screenshots/*.png
          if-no-files-found: error
