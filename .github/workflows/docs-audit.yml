name: docs-audit

on:
  push:
    paths:
      - 'docs/**'
  pull_request:
    paths:
      - 'docs/**'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify single-file docs entry and guide pages
        run: |
          test -f docs/index.html
          test -f docs/guide/quickstart.md
          test -f docs/guide/faq.md
