name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check architecture of any prebuilt native libs
        run: bash scripts/check_arch.sh

      - name: Run static security and gate scan
        run: python3 scripts/adjudicate.py --scan-static

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-provider: basic

      - name: Build Android Debug APK
        working-directory: client/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: client/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-provider: basic

      - name: Run Gradle unit tests
        working-directory: client/android
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --stacktrace

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-provider: basic

      - name: Run Gradle lint
        working-directory: client/android
        run: |
          chmod +x gradlew
          ./gradlew lintDebug --stacktrace

  ci-all-pass:
    name: CI-ALL-PASS
    needs: [ build, test, lint ]
    runs-on: ubuntu-latest
    steps:
      - name: All CI checks passed
        run: echo "CI-ALL-PASS"

  release:
    needs: [ ci-all-pass ]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment: production-release
    steps:
      - uses: actions/checkout@v4

      - name: Download Debug APK artifact
        uses: actions/download-artifact@v4
        with:
          name: android-debug-apk
          path: release-artifacts

      - name: Attach release artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            README.md
            release-artifacts/**/*.apk
