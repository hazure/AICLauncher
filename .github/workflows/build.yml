name: Android Build & Release

on:
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, reopened]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  build-debug-apk:
    if: >-
      github.event_name != 'pull_request' ||
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests and assembleDebug
        run: |
          chmod +x client/android/gradlew
          set -o pipefail
          cd client/android
          ./gradlew testDebugUnitTest assembleDebug --stacktrace 2>&1 | tee ../../build_output.log

      - name: Upload Debug APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: client/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Comment failure log on PR
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.BOT_PAT || secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let raw = '';
            if (fs.existsSync('build_output.log')) {
              raw = fs.readFileSync('build_output.log', 'utf8');
            }
            const lines = raw.split('\n');
            const interesting = [];
            for (let i = 0; i < lines.length; i++) {
              if (/FAILURE:|^(e:|> Task .* FAILED)|Exception:/i.test(lines[i])) {
                interesting.push(...lines.slice(Math.max(0, i - 2), Math.min(lines.length, i + 12)));
              }
            }
            let snippet = interesting.length > 0 ? interesting.join('\n') : lines.slice(-120).join('\n');
            if (snippet.length > 40000) {
              snippet = snippet.slice(-40000);
            }
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              '### ❌ Android 构建或单元测试失败',
              '',
              '请贡献者确认以下三项：',
              '1. 是否对代码进行过审查？',
              '2. 验证脚本是否全部 pass？',
              '3. 是否在本地跑过一遍？',
              '',
              `🔗 [查看完整 Actions 运行日志](${runUrl})`,
              '',
              '<details>',
              '<summary>编译/测试失败原文日志</summary>',
              '',
              '```text',
              snippet || '(empty log)',
              '```',
              '</details>'
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body
            });

      - name: Publish GitHub Release on dev/main push
        if: >-
          success() &&
          github.event_name == 'push' &&
          (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ secrets.BOT_PAT || secrets.GITHUB_TOKEN }}
        run: |
          GRADLE_FILE="client/android/app/build.gradle.kts"
          VERSION_NAME=$(grep -E 'versionName\s*=' "$GRADLE_FILE" | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          VERSION_CODE=$(grep -E 'versionCode\s*=' "$GRADLE_FILE" | head -n 1 | sed -E 's/[^0-9]//g')
          SHORT_SHA="${GITHUB_SHA::7}"
          APK_SRC="client/android/app/build/outputs/apk/debug/app-debug.apk"

          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            TAG="v${VERSION_NAME}"
            if gh release view "$TAG" >/dev/null 2>&1; then
              TAG="v${VERSION_NAME}-vc${VERSION_CODE}"
            fi
            APK_NAME="AICL_v${VERSION_NAME}_vc${VERSION_CODE}.apk"
            PRERELEASE_FLAG=""
            TITLE="AICLauncher ${TAG}"
          else
            TAG="dev-v${VERSION_NAME}-vc${VERSION_CODE}"
            APK_NAME="AICL_dev_v${VERSION_NAME}_vc${VERSION_CODE}_${SHORT_SHA}.apk"
            PRERELEASE_FLAG="--prerelease"
            TITLE="AICLauncher ${TAG} (${SHORT_SHA})"
          fi

          cp "$APK_SRC" "$APK_NAME"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_NAME" --clobber
          else
            gh release create "$TAG" "$APK_NAME" \
              --title "$TITLE" \
              --generate-release-notes \
              $PRERELEASE_FLAG
          fi
