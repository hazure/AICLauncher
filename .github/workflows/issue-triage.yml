name: Issue Triage

on:
  issues:
    types: [opened]

# 权限最小化：仅声明 issue 写入与 GitHub Models 只读权限，严禁 contents: write 等无关权限
permissions:
  issues: write
  models: read

# 同一 Issue 同时只运行一个 triage 任务，防止重复触发与限流放大
concurrency:
  group: issue-triage-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  triage:
    runs-on: ubuntu-latest
    # 仅处理普通 Issue，避免机器人自触发循环
    if: github.event.issue.pull_request == null && !endsWith(github.event.issue.user.login, '[bot]')
    steps:
      - name: Prepare triage prompt
        id: prepare
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const issue = context.payload.issue;
            const title = (issue.title || '').trim();
            const rawBody = (issue.body || '').trim();
            const maxBodyLen = 4000;
            const body = rawBody.length > maxBodyLen
              ? rawBody.slice(0, maxBodyLen) + '\n...(truncated)'
              : (rawBody || '(无正文)');

            const promptText = [
              '请分析以下 GitHub Issue，并严格按要求输出 JSON：',
              '',
              `标题：${title}`,
              '正文：',
              body,
            ].join('\n');

            const tempDir = process.env.RUNNER_TEMP || '/tmp';
            const promptPath = path.join(tempDir, 'issue-triage-prompt.txt');
            fs.writeFileSync(promptPath, promptText, 'utf8');
            core.setOutput('prompt_file', promptPath);

      # 调用 GitHub Models（低速率档 gpt-4.1-mini）；失败时不重试超过 1 次且不向 Issue 发送错误评论
      - name: Classify issue with GitHub Models
        id: ai
        uses: actions/ai-inference@v1
        with:
          model: openai/gpt-4.1-mini
          max-tokens: '400'
          prompt-file: ${{ steps.prepare.outputs.prompt_file }}
          system-prompt: |
            你是 AliceInCradle Android 兼容补丁仓库（AICL）的 Issue 自动分类助手。
            请阅读用户的 Issue 标题与正文，严格输出合法的纯 JSON 对象（不要包含 Markdown 代码块或任何多余文字），格式如下：
            {
              "labels": ["bug"],
              "confidence": "high",
              "missing_info": ["复现步骤", "AIC 版本", "设备/系统信息"],
              "summary": "一句话中文简要说明"
            }

            字段规范：
            1. labels：从 ["bug", "enhancement", "question", "duplicate", "invalid"] 中选择 1 个或多个最贴切的标签。
               - 崩溃、闪退、黑屏、报错、无法启动、渲染异常等属于 "bug"。
               - 功能建议、新特性请求属于 "enhancement"。
               - 使用咨询、配置疑问属于 "question"。
               - 明显重复问题属于 "duplicate"。
               - 无意义灌水或完全无关内容属于 "invalid"。
            2. confidence：只能是 "high"、"medium" 或 "low" 之一。仅当内容过于模糊完全无法判断类别时才填 "low"。
            3. missing_info：仅当 labels 包含 "bug" 时检查正文和标题是否提供了以下 3 项关键信息，将缺失项的准确名称放入数组（若全部具备则为空数组 []）；非 bug 类 issue 固定返回 []：
               - "复现步骤"（触发问题的具体操作流程或场景）
               - "AIC 版本"（游戏版本或补丁/AICL 版本号）
               - "设备/系统信息"（手机型号、Android 版本、Winlator/Wine/Turnip/Box64 等环境信息）
            4. summary：简短中文说明判断依据（不超过 60 字）。

      - name: Apply labels and triage comment
        uses: actions/github-script@v7
        env:
          AI_RESPONSE: ${{ steps.ai.outputs.response }}
          AI_RESPONSE_FILE: ${{ steps.ai.outputs.response-file }}
        with:
          script: |
            const fs = require('fs');

            let raw = (process.env.AI_RESPONSE || '').trim();
            if (!raw && process.env.AI_RESPONSE_FILE && fs.existsSync(process.env.AI_RESPONSE_FILE)) {
              raw = fs.readFileSync(process.env.AI_RESPONSE_FILE, 'utf8').trim();
            }
            if (!raw) {
              core.setFailed('AI inference returned empty response; skipping issue updates.');
              return;
            }

            const fenceMatch = raw.match(/```(?:json)?\s*([\s\S]*?)```/i);
            const jsonText = fenceMatch ? fenceMatch[1].trim() : raw;

            let result;
            try {
              result = JSON.parse(jsonText);
            } catch (err) {
              core.setFailed(`Failed to parse AI JSON response: ${err.message}`);
              return;
            }

            const allowedLabels = new Set(['bug', 'enhancement', 'question', 'duplicate', 'invalid']);
            const labels = Array.isArray(result.labels)
              ? [...new Set(result.labels.filter((l) => typeof l === 'string' && allowedLabels.has(l)))]
              : [];
            const confidence = ['high', 'medium', 'low'].includes(result.confidence)
              ? result.confidence
              : 'low';
            const allowedMissing = ['复现步骤', 'AIC 版本', '设备/系统信息'];
            const missingInfo = Array.isArray(result.missing_info)
              ? [...new Set(result.missing_info.filter((m) => allowedMissing.includes(m)))]
              : [];

            const disclaimer = '本回复由自动化工具生成，仅用于分类辅助，不代表项目作者立场';
            const { owner, repo } = context.repo;
            const issue_number = context.payload.issue.number;

            core.info(`Parsed triage result: labels=${JSON.stringify(labels)}, confidence=${confidence}, missing_info=${JSON.stringify(missingInfo)}`);

            // 置信度为 low 时不自动打标签，改为评论建议人工确认
            if (confidence === 'low' || labels.length === 0) {
              const body = [
                '感谢反馈！当前自动分类置信度较低，暂未自动添加标签，建议等待维护者人工确认分类。',
                '',
                disclaimer,
              ].join('\n');

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
              return;
            }

            const labelsToAdd = [...labels];
            const isBug = labels.includes('bug');
            if (isBug && missingInfo.length > 0) {
              labelsToAdd.push('needs-info');
            }

            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number,
              labels: labelsToAdd,
            });

            if (isBug && missingInfo.length > 0) {
              const missingList = missingInfo.map((item) => `- **${item}**`).join('\n');
              const body = [
                '感谢提交问题反馈！为了更快定位并排查该问题，建议补充以下信息：',
                '',
                missingList,
                '',
                '补充后维护者会尽快跟进处理，谢谢配合！',
                '',
                disclaimer,
              ].join('\n');

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
